<!-- @dsCard group="Colors" viewport="700x120" name="Semantic" subtitle="Success, warning, danger — muted, not corporate" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{margin:0;box-sizing:border-box}body{font-family:var(--font-body);display:flex;height:120px;gap:8px;padding:8px}
.sw{flex:1;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:13px;flex-direction:column;gap:4px}
</style></head><body>
<div class="sw" style="background:var(--success-bg);color:var(--success)">Success<span style="width:20px;height:20px;border-radius:50%;background:var(--success)"></span></div>
<div class="sw" style="background:var(--warning-bg);color:var(--warning)">Warning<span style="width:20px;height:20px;border-radius:50%;background:var(--warning)"></span></div>
<div class="sw" style="background:var(--danger-bg);color:var(--danger)">Danger<span style="width:20px;height:20px;border-radius:50%;background:var(--danger)"></span></div>
</body></html>
