name: Android (TWA) build

# Migración 059 — arma el paquete de Android (.aab, para subir a Play
# Console) a partir de la PWA ya publicada en libris.cl, envuelta con
# Bubblewrap (Trusted Web Activity). Corre acá, NO en el entorno de
# Claude Code — ese entorno bloquea el acceso a dl.google.com (donde vive
# el Android SDK), así que nunca podría bajarlo. Los runners de GitHub sí
# tienen internet completo.
#
# Manual a propósito (workflow_dispatch, no en cada push): armar el .aab
# no hace falta en cada cambio de la app — el contenido de la PWA se
# actualiza solo, en vivo, cada vez que Vercel despliega. Solo hace falta
# correr esto de nuevo si cambia algo del EMPAQUETADO nativo (ícono,
# nombre, colores, versión) — eso vive en android/twa-manifest.json.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `android-actions/setup-android@v3` (usado acá antes) intenta
      # instalar además un paquete llamado "tools" que Google ya sacó de
      # su repositorio hace años — falla siempre, en cualquier repo que
      # lo use hoy. No hace falta ese action de todos modos: el runner de
      # GitHub (`ubuntu-latest`) YA trae un Android SDK instalado y con
      # las licencias aceptadas (`$ANDROID_HOME`), así que alcanza con
      # aceptar cualquier licencia que falte para lo puntual que
      # Bubblewrap vaya a necesitar (build-tools de una versión
      # específica, por ejemplo).
      - name: Aceptar licencias del Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # Bubblewrap guarda, la primera vez que corre en una máquina, qué
      # JDK/SDK usar en ~/.bubblewrap/config.json — sin esto, pregunta de
      # forma interactiva (si instalarlos él mismo) y un runner de CI no
      # tiene con quién hablar, así que se quedaría esperando para
      # siempre. Se lo dejamos ya resuelto, apuntando al JDK 17 de arriba
      # y al Android SDK que el runner ya trae instalado.
      - name: Configurar Bubblewrap (sin prompts)
        run: |
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK_PATH\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      # La clave de firma NUNCA vive en el repo — se restaura acá desde un
      # secret (ver instrucciones más abajo para cargarlo la primera vez).
      - name: Restaurar la clave de firma
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # Genera el proyecto Android (carpeta app/, gradlew, etc.) desde
      # android/twa-manifest.json — se regenera de cero en cada corrida,
      # por eso nada de esto se versiona (ver .gitignore). skipVersionUpgrade
      # evita que pregunte por un nombre de versión nuevo cada vez.
      - name: Generar el proyecto Android
        working-directory: android
        run: npx -y @bubblewrap/cli update --skipVersionUpgrade

      # Con BUBBLEWRAP_KEYSTORE_PASSWORD/BUBBLEWRAP_KEY_PASSWORD puestas,
      # build no pregunta nada — están documentadas para este uso exacto
      # (CI) en el propio README de @bubblewrap/cli. Como la clave es
      # PKCS12, las dos son la misma contraseña.
      - name: Compilar y firmar (.aab + .apk)
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx -y @bubblewrap/cli build

      - uses: actions/upload-artifact@v4
        with:
          name: libris-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90
