<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{margin:0;box-sizing:border-box}body{font-family:var(--font-body);display:flex;height:140px;gap:12px;padding:12px;background:var(--surface-page)}

</style></head><body>
<div class="b" style="background:var(--surface-page);border:1px solid var(--border-default)">page</div>
<div class="b" style="background:var(--surface-card);box-shadow:var(--shadow-md)">card</div>
<div class="b" style="background:var(--surface-sunken)">sunken</div>
<div class="b" style="background:var(--surface-card);border:1px solid var(--border-subtle)">border-subtle</div>
<div class="b" style="background:var(--surface-card);border:1px solid var(--border-strong)">border-strong</div>
</body></html>
