<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base unit" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{margin:0;box-sizing:border-box}body{padding:16px;background:var(--surface-page);font-family:var(--font-body);display:flex;align-items:flex-end;gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text-tertiary)}
.bar{width:16px;background:var(--accent-500);border-radius:2px}
</style></head><body>
<div class="col"><div class="bar" style="height:var(--space-3)"></div>8</div>
<div class="col"><div class="bar" style="height:var(--space-4)"></div>12</div>
<div class="col"><div class="bar" style="height:var(--space-5)"></div>16</div>
<div class="col"><div class="bar" style="height:var(--space-6)"></div>20</div>
<div class="col"><div class="bar" style="height:var(--space-7)"></div>24</div>
<div class="col"><div class="bar" style="height:var(--space-8)"></div>32</div>
<div class="col"><div class="bar" style="height:var(--space-9)"></div>40</div>
<div class="col"><div class="bar" style="height:var(--space-10)"></div>48</div>
<div class="col"><div class="bar" style="height:var(--space-12)"></div>64</div>
</body></html>
