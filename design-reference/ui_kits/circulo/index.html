<!-- @dsCard group="Libris (App)" viewport="430x760" name="Libris — App móvil" subtitle="Ficha del club, progreso, comentarios, novedades, descubrir" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--neutral-200);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
#phone{width:390px;height:760px;background:var(--surface-page);border-radius:36px;overflow:hidden;box-shadow:var(--shadow-lg);position:relative;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto}
#tabbar{position:absolute;bottom:0;left:0;right:0;height:70px;background:var(--surface-card);border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-around;padding-bottom:8px}
.tabbtn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:var(--font-body);font-size:10px;font-weight:600}
</style></head><body>
<div id="phone"><div id="screen"></div><div id="tabbar"></div></div>
<script type="text/babel" src="ClubDetail.jsx"></script>
<script type="text/babel" src="UpdateProgressModal.jsx"></script>
<script type="text/babel" src="CommentsFeed.jsx"></script>
<script type="text/babel" src="NewsFeed.jsx"></script>
<script type="text/babel" src="Discover.jsx"></script>
<script type="text/babel">
const { Icon } = window.LibrisDesignSystem_f40bc3;
function TabBar({ active, onChange }) {
  const tabs = [ ['club','book-open','Club'], ['news','bell','Novedades'], ['discover','compass','Descubrir'] ];
  return (
    <div id="tabbar-inner" style={{display:'flex', width:'100%', justifyContent:'space-around'}}>
      {tabs.map(([key, icon, label]) => (
        <button key={key} className="tabbtn" onClick={()=>onChange(key)} style={{color: active===key ? 'var(--accent-500)' : 'var(--text-tertiary)'}}>
          <Icon name={icon} size={20} color={active===key ? 'var(--accent-500)' : 'var(--text-tertiary)'}/>{label}
        </button>
      ))}
    </div>
  );
}
function Root(){
  const [view, setView] = React.useState('club');
  const [showModal, setShowModal] = React.useState(false);
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (<React.Fragment>
    {view==='club' && <window.ClubDetail onUpdateProgress={()=>setShowModal(true)} onOpenComments={()=>setView('comments')}/>}
    {view==='comments' && <window.CommentsFeed onBack={()=>setView('club')}/>}
    {view==='news' && <window.NewsFeed/>}
    {view==='discover' && <window.Discover/>}
    {showModal && <window.UpdateProgressModal onClose={()=>setShowModal(false)}/>}
    <TabBarMount view={view} setView={setView}/>
  </React.Fragment>);
}
function TabBarMount({view, setView}){
  React.useEffect(()=>{
    ReactDOM.createRoot(document.getElementById('tabbar')).render(<TabBar active={view==='comments' ? 'club' : view} onChange={setView}/>);
  }, [view]);
  return null;
}
ReactDOM.createRoot(document.getElementById('screen')).render(<Root/>);
</script>
</body></html>
